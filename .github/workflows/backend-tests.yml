name: Backend Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  backend-tests:
    name: Run backend pytest suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      PYTHONPATH: .
      JWT_SECRET_KEY: test-secret
      JWT_ALGORITHM: HS256
      AUTH_DEV_MODE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tenant tests
        run: |
          pytest tests/test_tenant.py -v

      - name: Run workspace RAG route tests
        run: |
          pytest tests/test_workspace_rag_routes.py -v